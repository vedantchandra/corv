[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "corv"
version = "2.0"
authors = [
  { name="Vedant Chandra", email="vedant.chandra@cfa.harvard.edu" },
  { name="Stefan Arseneau", email="arseneau@bu.edu"}
]
description = "compact object radial velocities"
readme = "README.md"
requires-python = ">=3.8"
dependencies = ["numpy", "scipy", "lmfit", "matplotlib", "astropy", "tqdm", "h5py"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]

[project.optional-dependencies]
test = ["pytest"]
validation = ["astroquery"]

[project.urls]
Homepage = "https://github.com/vedantchandra/corv"
Issues = "https://github.com/vedantchandra/corv/issues"

[tool.setuptools.exclude-package-data]
# raw model files are only inputs to scripts/build_model_grids.py
corv = ["models/*/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["validation: slow comparison against external data; needs network (run with --run-validation)"]
filterwarnings = ["ignore::SyntaxWarning"]
